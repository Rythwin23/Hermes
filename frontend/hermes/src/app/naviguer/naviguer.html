<section class="page-header">
  <div>
    <span class="eyebrow">Rechercher un trajet</span>
    <h2>Naviguer</h2>
  </div>
</section>

<section class="search-panel">
  <div class="field-group">
    <label for="from">Gare de départ</label>
    <input id="from" type="text" value="Châtelet" />
  </div>

  <div class="field-group">
    <label for="to">Gare d'arrivée</label>
    <input id="to" type="text" value="La Défense" />
  </div>

  <div class="field-group">
    <label for="date">Date</label>
    <input id="date" type="date" value="2026-08-31" />
  </div>

  <div class="field-group">
    <label for="time">Heure</label>
    <input id="time" type="time" value="08:30" />
  </div>

  <button class="search-btn" type="button">Rechercher</button>
</section>

<section class="table-section">
  <div class="table-header">
    <h3>Itinéraires disponibles</h3>
    <span>3 résultats</span>
  </div>

  <ag-grid-angular
    [theme]="myTheme"
    [modules]="modules"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    style="width: 100%; height: 20em"
  ></ag-grid-angular>
</section>
